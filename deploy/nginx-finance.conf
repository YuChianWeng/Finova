# 替代做法：前面有 nginx 時，/finance 直接由 nginx 提供 dist/，其他路徑轉給 Next.js。
# dist/ 放在 /srv/finova/dist（npm run build 的輸出）。
# 注意：Cloudflare Access 要保護整個網域（或至少 /finance* 與 /api/ledger*），不是只保護 Next。

location = /finance { return 301 /finance/; }

location /finance/ {
    alias /srv/finova/dist/;
    # 找不到檔案（前端路由，例如 /finance/accounts/ESunBank）就回 index.html
    try_files $uri $uri/ /finance/index.html;
    add_header Cache-Control "no-cache" always;
}

# 帶 hash 的檔案：長期快取
location /finance/assets/ {
    alias /srv/finova/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;   # 不 fallback，缺檔就 404，不要回 index.html
}

location = /finance/sw.js {
    alias /srv/finova/dist/sw.js;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/finance/" always;
}

location = /finance/manifest.webmanifest {
    alias /srv/finova/dist/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

# /api/ledger/* 與其他路徑照舊轉給 Next.js（或記帳後端）
# location / { proxy_pass http://127.0.0.1:3000; ... }
