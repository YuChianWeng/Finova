<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finova 記帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column with a bottom tab bar; at 960px and wider, a 236px left rail plus a 12-column content grid (max 1200px). Signal Grid: hairline instrument panels on a 24px measurement grid. */
:root{
  /* Layout: phone-first single column with a bottom tab bar; at 960px and wider, a 236px left rail plus a 12-column content grid (max 1200px). Soft ledger: calm charcoal (dark) or pale coffee paper (light); income sage, expense dusty rose, transfer amber. */
  --bg:#151618; --grid:transparent;
  --s1:#1D1E21; --s2:#25272B; --s3:#2E3035;
  --ln:#2A2C30; --ln2:#3A3D43;
  --tx:#ECE8E2; --mu:#9C978F;
  --ac:#86B6D6; --ac-ink:#11202B; --ac-soft:rgba(134,182,214,.14); --ac-line:rgba(134,182,214,.45);
  --glow:0 6px 18px rgba(0,0,0,.35);
  --inc:#A8C08E; --exp:#E3938F; --tr:#DDA46E; --on-cat:#FFFFFF; --lnf:rgba(134,182,214,.16);
  --wa:#E2B66F; --wa-soft:rgba(226,182,111,.14);
  --dg:#E3938F; --dg-soft:rgba(227,147,143,.14); --dg-ink:#2A1210;
  --c1:#CFAF86; --c2:#86B6D6; --c3:#D9976A; --c4:#A8C08E; --c5:#C39BC0; --c6:#8E9197;
  --scrim:rgba(0,0,0,.6); --shadow:0 20px 50px rgba(0,0,0,.5); --skel:#222428;
  --f-d:'Manrope','Noto Sans TC',system-ui,sans-serif;
  --f-b:'Noto Sans TC','Manrope',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-m:'Manrope','Noto Sans TC',system-ui,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F1EA; --grid:transparent;
    --s1:#FCFAF6; --s2:#F1EAE1; --s3:#E8DFD3;
    --ln:#E6DCCF; --ln2:#D2C3B2;
    --tx:#3A2F28; --mu:#75655A;
    --ac:#8A6A4F; --ac-ink:#FFFFFF; --ac-soft:rgba(138,106,79,.12); --ac-line:rgba(138,106,79,.45);
    --glow:0 6px 16px rgba(90,60,30,.18);
    --inc:#567340; --exp:#B4544B; --tr:#9A5F24; --on-cat:#FFFFFF; --lnf:rgba(138,106,79,.12);
    --wa:#9A6118; --wa-soft:rgba(176,112,40,.13);
    --dg:#B4544B; --dg-soft:rgba(180,84,75,.10); --dg-ink:#FFFFFF;
    --c1:#C49A6C; --c2:#7E9DB4; --c3:#C98058; --c4:#8BA477; --c5:#AE88AB; --c6:#A0958B;
    --scrim:rgba(60,40,25,.35); --shadow:0 20px 50px rgba(90,60,30,.15); --skel:#ECE4DA;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
    --bg:#F6F1EA; --grid:transparent;
    --s1:#FCFAF6; --s2:#F1EAE1; --s3:#E8DFD3;
    --ln:#E6DCCF; --ln2:#D2C3B2;
    --tx:#3A2F28; --mu:#75655A;
    --ac:#8A6A4F; --ac-ink:#FFFFFF; --ac-soft:rgba(138,106,79,.12); --ac-line:rgba(138,106,79,.45);
    --glow:0 6px 16px rgba(90,60,30,.18);
    --inc:#567340; --exp:#B4544B; --tr:#9A5F24; --on-cat:#FFFFFF; --lnf:rgba(138,106,79,.12);
    --wa:#9A6118; --wa-soft:rgba(176,112,40,.13);
    --dg:#B4544B; --dg-soft:rgba(180,84,75,.10); --dg-ink:#FFFFFF;
    --c1:#C49A6C; --c2:#7E9DB4; --c3:#C98058; --c4:#8BA477; --c5:#AE88AB; --c6:#A0958B;
    --scrim:rgba(60,40,25,.35); --shadow:0 20px 50px rgba(90,60,30,.15); --skel:#ECE4DA;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; background-attachment:fixed;
  color:var(--tx); font:15px/1.55 var(--f-b); -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}
.num,.amt{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:12px}
.eyebrow{font:500 11px/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0}
.h2{font:600 16px/1.3 var(--f-d);margin:0;letter-spacing:.01em;text-wrap:balance}
.big{font:600 28px/1.1 var(--f-m);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.huge{font:600 40px/1.05 var(--f-m);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.hr{height:1px;background:var(--ln);border:0;margin:4px 0}

/* amounts: never colour-only — sign glyph + weight + colour */
.amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--ac)}
.amt.out{color:var(--tx)}
.amt.tr{color:var(--mu)}
.amt.adj{color:var(--mu);border:1px dashed var(--ln2);border-radius:4px;padding:0 5px}

/* app shell */
.app{display:flex;min-height:100vh}
.rail{display:none}
.main{flex:1;min-width:0;padding-left:var(--gut);padding-right:var(--gutr);padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
.wrapc{max-width:1200px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr));padding:12px var(--gutr) 12px var(--gut);background:var(--bg);border-bottom:1px solid var(--ln)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font:700 24px/1.1 var(--f-d);margin:2px 0 0;letter-spacing:.01em}
.top .grow{flex:1;min-width:0}
.led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);vertical-align:middle;margin-right:6px}
#view{padding-top:16px}
.ibtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--r-m);border:1px solid var(--ln);background:var(--s1);color:var(--tx);cursor:pointer;position:relative;flex:none}
.ibtn:hover{border-color:var(--ac-line)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--wa);color:var(--ac-ink);font:600 11px/18px var(--f-m);text-align:center}
:root[data-theme="light"] .badge{color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--ln2);background:var(--s2);color:var(--tx);font:600 14px/1 var(--f-b);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ac-line)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.p:hover{box-shadow:var(--glow)}
.btn.g{background:transparent;border-color:transparent;color:var(--mu)}
.btn.g:hover{color:var(--tx);background:var(--s2)}
.btn.d{background:var(--dg);border-color:var(--dg);color:var(--dg-ink)}
.btn.dg-t{background:transparent;border-color:var(--ln2);color:var(--dg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ac);font:500 13px var(--f-b);cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;min-height:32px}

/* rail */
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand b{font:700 18px/1 var(--f-d);letter-spacing:.12em}
.brand small{display:block;font:500 10px/1.4 var(--f-m);letter-spacing:.18em;color:var(--mu)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--tx);background:var(--s2)}
.nav a[aria-current="page"]{color:var(--tx);background:var(--s2);box-shadow:inset 2px 0 0 var(--ac)}
.nav .sep{height:1px;background:var(--ln);margin:10px 8px}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--ln)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--s1);border-top:1px solid var(--ln);padding:6px var(--gutr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--mu);text-decoration:none;font:500 11px/1 var(--f-b);background:none;border:0;cursor:pointer}
.tabbar a[aria-current="page"]{color:var(--ac)}
.tabbar .fab{width:60px;height:60px;border-radius:18px;background:var(--ac);color:var(--ac-ink);box-shadow:var(--glow);justify-self:center;transform:translateY(-14px);min-height:0}
.tabbar .fab .ic{width:28px;height:28px;stroke-width:2.2}

@media (min-width:960px){
  .rail{display:flex;flex-direction:column;width:236px;flex:none;position:sticky;top:0;height:100vh;border-right:1px solid var(--ln);background:var(--s1);padding:20px 12px 16px max(12px, env(safe-area-inset-left,0px))}
  .tabbar{display:none}
  .main{padding-left:32px;padding-right:max(32px, env(safe-area-inset-right,0px));padding-block:0 56px}
  .top{margin-left:-32px;margin-right:calc(-1 * max(32px, env(safe-area-inset-right,0px)));padding:16px max(32px, env(safe-area-inset-right,0px)) 16px 32px}
  .only-m{display:none!important}
  :root{--gut:32px}
}
@media (max-width:959.98px){ .only-d{display:none!important} }

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.grid>*{grid-column:span 12;min-width:0}
@media (min-width:720px){
  .sp-4,.sp-6{grid-column:span 6} .sp-8{grid-column:span 12}
}
@media (min-width:1180px){
  .sp-4{grid-column:span 4} .sp-8{grid-column:span 8} .sp-6{grid-column:span 6}
}

.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r-l);padding:16px;min-width:0}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block;color:inherit;font:inherit}
.card.tap:hover{border-color:var(--ac-line)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.ch .h2{display:flex;align-items:center;gap:8px}
.sect{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sect:first-child{margin-top:0}

/* KPI strip */
.kpis{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr));padding:2px var(--gutr) 4px var(--gut);scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 76%;scroll-snap-align:start;scroll-margin-left:var(--gut);display:flex;flex-direction:column;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r-l);padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.kpi:hover{border-color:var(--ac-line)}
.kpi .v{font:600 28px/1.1 var(--f-m);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media (min-width:720px){
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin:0;padding:0}
  .kpi{flex:none}
}
.delta{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--f-m);padding:3px 7px;border-radius:5px;background:var(--s2);white-space:nowrap}
.delta.good{color:var(--ac)} .delta.bad{color:var(--wa)} .delta.flat{color:var(--mu)}

/* progress + status */
.pb{height:8px;border-radius:99px;background:var(--s3);position:relative;overflow:hidden}
.pb>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--ac);max-width:100%}
.pb.warn>i{background:var(--wa)}
.pb.over>i{background:repeating-linear-gradient(-45deg,var(--dg) 0 5px,transparent 5px 8px),var(--dg-soft);width:100%!important}
.pb.done>i{background:var(--ac)}
.pb .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx);opacity:.55}
.pb.thin{height:6px}
.st{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-m);padding:4px 7px;border-radius:5px;letter-spacing:.03em;white-space:nowrap}
.st.ok{color:var(--ac);background:var(--ac-soft)}
.st.warn{color:var(--wa);background:var(--wa-soft)}
.st.over{color:var(--dg);background:var(--dg-soft)}
.st.done{color:var(--ac);background:var(--ac-soft)}
.st.neu{color:var(--mu);background:var(--s2)}

/* chips & segmented */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);font:500 14px/1 var(--f-b);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ac-line)}
.chip[aria-pressed="true"]{background:var(--ac-soft);border-color:var(--ac)}
.chip .ck-i{display:none}
.chip[aria-pressed="true"] .ck-i{display:block}
.fchip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 6px 0 10px;border-radius:7px;background:var(--ac-soft);border:1px solid var(--ac-line);color:var(--tx);font:500 13px var(--f-b);cursor:pointer}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr));padding:2px var(--gutr) 2px var(--gut)}
.sheet .chips-scroll{margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr))}
.seg{display:inline-flex;padding:3px;background:var(--s2);border:1px solid var(--ln);border-radius:var(--r-m);gap:2px;max-width:100%;overflow-x:auto}
.seg button{min-height:38px;min-width:44px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--mu);font:600 13px/1 var(--f-b);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ac-line)}
.seg.full{display:flex;width:100%} .seg.full button{flex:1}
.src{font:500 10.5px/1.4 var(--f-m);letter-spacing:.02em;padding:1px 6px;border:1px solid var(--ln2);border-radius:4px;color:var(--mu);white-space:nowrap}
.ptag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--s3);color:var(--tx);white-space:nowrap;font-weight:500}
.unc{color:var(--wa);font-weight:500}

/* transactions */
.list{display:flex;flex-direction:column}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 2px 8px;font:500 12px/1.3 var(--f-m);color:var(--mu);border-bottom:1px solid var(--ln)}
.gh b{font-weight:600;color:var(--tx)}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}
.sw-acts{position:absolute;inset:0 0 0 auto;display:flex}
.sw-acts button{width:68px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px var(--f-b);cursor:pointer}
.sw-e{background:var(--s3);color:var(--tx)}
.sw-d{background:var(--dg);color:var(--dg-ink)}
.tx{position:relative;display:flex;align-items:center;gap:10px;background:var(--s1);transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.tx-b{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 6px 10px 4px;background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;min-height:64px}
.tx-b:hover .tx-t{color:var(--ac)}
.cat-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln);flex:none}
.tx-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx-t{font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.tx-t>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-s{font-size:12.5px;color:var(--mu);display:flex;gap:6px;flex-wrap:wrap;align-items:center;line-height:1.4}
.tx-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ck{display:grid;place-items:center;width:44px;height:44px;flex:none;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--ac);cursor:pointer}
.sumbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--r-l);overflow:hidden}
.sumbar>div{background:var(--s1);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sumbar .num{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batchbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-top:12px;background:var(--s2);border:1px solid var(--ac-line);border-radius:var(--r-l);box-shadow:var(--shadow)}
@media (min-width:960px){.batchbar{bottom:16px}}
.search{position:relative;flex:1;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search input{padding-left:40px}

/* inputs */
.in{min-height:44px;border-radius:var(--r-m);border:1px solid var(--ln2);background:var(--s2);color:var(--tx);padding:0 12px;font:15px var(--f-b);width:100%}
.in:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px var(--ac-soft)}
.in[aria-invalid="true"]{border-color:var(--dg)}
select.in{appearance:auto}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.eyebrow{display:block}
.err{color:var(--dg);font-size:13px;display:flex;gap:6px;align-items:center;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

/* sheet / dialog / toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92%;background:var(--s1);border-top:1px solid var(--ln2);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),max-height .25s;display:flex;flex-direction:column;box-shadow:var(--shadow);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:0 var(--gutr) 10px var(--gut);border-bottom:1px solid var(--ln)}
.sheet-h .h2{flex:1}
.grab{display:block;width:100%;height:22px;border:0;background:none;cursor:ns-resize;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--ln2)}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow:auto;padding:16px var(--gutr) 20px var(--gut);flex:1;display:flex;flex-direction:column;gap:18px}
.sheet-f{border-top:1px solid var(--ln);padding:12px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);display:flex;gap:8px;flex-wrap:wrap}
.sheet-f .btn{flex:1}
@media (min-width:960px){

}

const CH={};
function dailyChart(key,spend,budget,upto,startLabel){
  const n=spend.length,W=660,H=230,L=40,R=46,Tp=14,B=26,iw=W-L-R,ih=H-Tp-B;
  const bmax=niceMax(Math.max(...spend,100)),total=sum(spend.slice(0,upto)),cmax=niceMax(Math.max(budget,total));
  const bw=iw/n;let s='';
  for(let i=0;i<=4;i++){const y=Tp+ih*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="g"/><text x="${L-6}" y="${y+3.5}" class="ax" text-anchor="end">${short(bmax*(1-i/4))}</text><text x="${W-R+6}" y="${y+3.5}" class="ax">${short(cmax*(1-i/4))}</text>`}
  spend.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;if(i<upto){const h=Math.max(1.5,v/bmax*ih);s+=`<rect x="${x.toFixed(1)}" y="${(Tp+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" class="bar" rx="1.5"/>`}else s+=`<rect x="${x.toFixed(1)}" y="${Tp+ih-2}" width="${w.toFixed(1)}" height="2" class="bar-f"/>`});
  s+=`<line x1="${L}" y1="${Tp+ih}" x2="${W-R}" y2="${(Tp+ih-budget/cmax*ih).toFixed(1)}" class="pace"/>`;
  let c=0;const pts=[];for(let i=0;i<upto;i++){c+=spend[i];pts.push([L+(i+.5)*bw,Tp+ih-c/cmax*ih])}
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" class="cum"/>`;
  if(pts.length){const p=pts[pts.length-1];s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" class="dot wa"/>`}
  [1,5,10,15,20,25,n].forEach(d=>{if(d<=n)s+=`<text x="${(L+(d-.5)*bw).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${d}</text>`});
  s+=`<line class="guide" id="gd-${key}" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" visibility="hidden"/>`;
  s+=`<rect class="hit" data-chart="${key}" x="${L}" y="${Tp}" width="${iw}" height="${ih}"/>`;
  CH[key]={n,spend,upto,budget,L,iw,W,label:startLabel};
  const ro=readout(key,upto-1);
  return `<div class="chart"><div class="readout" id="ro-${key}">${ro}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日支出長條、累計支出折線與預算線">${s}</svg>
  <div class="legend"><span><i class="sw-bar"></i>每日支出（左軸）</span><span><i class="sw-line"></i>累計支出（右軸）</span><span><i class="sw-dash"></i>預算進度線</span></div></div>`;
}
function readout(key,i){
  const c=CH[key];if(!c)return '';i=Math.max(0,Math.min(c.n-1,i));
  const cum=sum(c.spend.slice(0,Math.min(i+1,c.upto)));const pace=Math.round(c.budget*(i+1)/c.n);
  const has=i<c.upto;
  return `<span>${c.label} ${i+1} 日</span><span>當日 <b>${has?fmt(c.spend[i]):'—'}</b></span><span>累計 <b>${has?fmt(cum):'—'}</b></span><span>預算線 <b>${fmt(pace)}</b></span>`;
}
function donut(items,center,sub,drill){

function lineChart(vals,o){

function goalInfo(g){

function filtered(){
  const f=S.filters;
  return TX.filter(t=>{
    if(f.range==='month'&&!t.d.startsWith('2026-11'))return false;
    if(f.range==='last'&&!t.d.startsWith('2026-10'))return false;
    if(f.range==='7d'&&daysBetween(t.d,TODAY)>6)return false;
    if(f.range.startsWith('day:')&&t.d!==f.range.slice(4))return false;
    if(f.types.length&&!f.types.includes(t.type))return false;
    if(f.accs.length&&!(f.accs.includes(t.acc)||f.accs.includes(t.to)))return false;
    if(f.cats.length&&!f.cats.some(c=>c==='未分類'?t.unc:c.includes('›')?(t.cat+' › '+t.sub)===c:t.cat===c))return false;
    if(f.srcs.length&&!f.srcs.includes(t.src))return false;
    if(f.min&&t.amt<+f.min)return false;
    if(f.max&&t.amt>+f.max)return false;
    if(f.q){const q=f.q.toLowerCase();if(!(t.m+' '+(t.note||'')).toLowerCase().includes(q))return false}
    return true;
  }).sort(S.sort==='amt'?(a,b)=>b.amt-a.amt:(a,b)=>(b.d+b.t).localeCompare(a.d+a.t));

      <div class="card sp-6"><div class="ch"><h2 class="h2">商家前 10 名</h2></div>${mtop.length?`<div class="hbars">${mtop.map(([k,v],i)=>`<button class="hb" data-a="gotx-q" data-k="${esc(k)}" style="grid-template-columns:96px minmax(0,1fr) auto"><span class="hb-n" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="num mu">${String(i+1).padStart(2,'0')}</span> ${esc(k)}</span><span class="hb-t"><i style="width:${v/mm*100}%"></i></span><span class="hb-v">${fmt(v)}</span></button>`).join('')}</div>`:emptyState('沒有逐筆資料','這個月份是從 MOZE 匯入的彙總，沒有商家明細。')}</div>
      <div class="card sp-6"><div class="ch"><h2 class="h2">預算達成</h2></div>${cur.real?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>分類</th><th class="r">已用</th><th class="r">上限</th><th class="r">%</th><th>狀態</th></tr></thead><tbody>${BUD.map(b=>{const p=b.used/b.lim;return `<tr><td>${b.cat}</td><td class="r num">${fmt(b.used)}</td><td class="r num mu">${fmt(b.lim)}</td><td class="r num">${Math.round(p*100)}%</td><td>${stPill(state(p))}</td></tr>`}).join('')}</tbody></table></div>`:emptyState('當時尚未設定預算','預算從 11 月開始啟用。')}</div>
      <div class="card sp-6"><div class="ch"><h2 class="h2">固定 vs 變動支出</h2></div><div class="panel-tot" style="grid-template-columns:1fr 1fr"><div><span class="eyebrow">固定（訂閱、居家）</span><span class="amt">${fmt(fixed)}</span><span class="xs mu">${pct1(fixed/Math.max(1,cur.exp))}</span></div><div><span class="eyebrow">變動</span><span class="amt">${fmt(vari)}</span><span class="xs mu">${pct1(vari/Math.max(1,cur.exp))}</span></div></div>
        <p class="eyebrow" style="margin:18px 0 8px">各帳戶收支</p>${accRows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>帳戶</th><th class="r">流入</th><th class="r">流出</th></tr></thead><tbody>${accRows.map(([a,i,o])=>`<tr><td>${a.name}</td><td class="r num" style="color:var(--ac)">+${fmt(i)}</td><td class="r num">${MINUS}${fmt(o)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sm mu">彙總月份沒有帳戶明細</p>'}</div>
    </div>`;
  }else{
    const ms=[...Array(11)].map((_,i)=>monthData(i+1));const L2=ms.map((_,i)=>(i+1)+'月');
    const W=640,H=220,Lp=40,Rp=10,Tp=16,B=24,iw=W-Lp-Rp,ih=H-Tp-B,mx=niceMax(Math.max(...ms.map(x=>Math.max(x.inc,x.exp)))),bw=iw/12;
    let s='';for(let i=0;i<=4;i++){const y=Tp+ih*i/4;s+=`<line class="g" x1="${Lp}" x2="${W-Rp}" y1="${y}" y2="${y}"/><text class="ax" x="${Lp-6}" y="${y+3.5}" text-anchor="end">${short(mx*(1-i/4))}</text>`}
    const netPts=[];ms.forEach((x,i)=>{const x0=Lp+i*bw+bw*.14,w=bw*.34;const hi=x.inc/mx*ih,he=x.exp/mx*ih;s+=`<rect class="bar inc" x="${x0}" y="${Tp+ih-hi}" width="${w}" height="${hi}" rx="1.5"/><rect class="bar out" x="${x0+w+2}" y="${Tp+ih-he}" width="${w}" height="${he}" rx="1.5"/><text class="ax" x="${x0+w}" y="${H-6}" text-anchor="middle">${i+1}</text>`;netPts.push([x0+w+1,Tp+ih-(x.inc-x.exp)/mx*ih])});

    const cats=['餐飲','交通','購物','娛樂','訂閱','其他'];const sm=niceMax(Math.max(...exps));let st='';
    for(let i=0;i<=2;i++){const y=Tp+ih*i/2;st+=`<line class="g" x1="${Lp}" x2="${W-Rp}" y1="${y}" y2="${y}"/><text class="ax" x="${Lp-6}" y="${y+3.5}" text-anchor="end">${short(sm*(1-i/2))}</text>`}
    ms.forEach((x,i)=>{let y=Tp+ih;cats.forEach(k=>{if(S.hid.has(k))return;const v=x.cats[k]||0,h=v/sm*ih;y-=h;st+=`<rect x="${Lp+i*bw+bw*.2}" y="${y}" width="${bw*.6}" height="${h}" style="fill:${CATS[k].c}"><title>${i+1}月 ${k} ${fmt(v)}</title></rect>`});st+=`<text class="ax" x="${Lp+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`});
    body=`<div class="grid">
      <div class="card sp-8"><div class="ch"><h2 class="h2">每月收入／支出與淨額</h2></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="2026 每月收支">${s}</svg></div><div class="legend"><span><i class="sw-bar"></i>收入</span><span><i class="sw-bar" style="background:var(--c2)"></i>支出</span><span><i class="sw-line"></i>淨額</span></div></div>
      <div class="card sp-4"><div class="ch"><h2 class="h2">1–10 月統計</h2><span class="eyebrow">11 月進行中</span></div><div class="stack" style="gap:0">
        <div class="between" style="min-height:52px;border-bottom:1px solid var(--ln)"><span class="mu">月平均支出</span><span class="amt">${fmt(avg)}</span></div>
        <div class="between" style="min-height:52px;border-bottom:1px solid var(--ln)"><span class="mu">最高月 · ${hiI+1} 月</span><span class="amt">${fmt(full[hiI])}</span></div>
        <div class="between" style="min-height:52px;border-bottom:1px solid var(--ln)"><span class="mu">最低月 · ${loI+1} 月</span><span class="amt">${fmt(full[loI])}</span></div>
        <div class="between" style="min-height:52px"><span class="mu">累計淨額</span><span class="amt inc">+${fmt(sum(ms.map(x=>x.inc-x.exp)))}</span></div></div></div>
      <div class="card sp-8"><div class="ch"><h2 class="h2">各主分類每月組成</h2><span class="eyebrow">點圖例隱藏／顯示</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月分類堆疊長條">${st}</svg></div>
        <div class="wrap-row" style="margin-top:10px">${cats.map(k=>`<button class="chip" style="min-height:36px" data-a="hid" data-k="${k}" aria-pressed="${!S.hid.has(k)}"><i class="dotc" style="width:10px;height:10px;border-radius:3px;background:${CATS[k].c};${S.hid.has(k)?'opacity:.25':''}"></i>${k}</button>`).join('')}</div></div>
      <div class="card sp-4"><div class="ch"><h2 class="h2">趨勢</h2></div><p class="sm mu" style="margin:0 0 10px">餐飲 · 近 11 個月</p>${lineChart(ms.map(x=>x.cats['餐飲']||0),{xl:[[0,'1月'],[10,'11月']],label:'餐飲 11 個月趨勢'})}</div>
    </div>`;
  }
  return head+body;
}

   <div class="card sp-8"><div class="ch"><h2 class="h2">分類預算</h2>${S.budEdit?`<div class="row"><button class="btn sm g" data-a="bud-edit">取消</button><button class="btn sm p" data-a="bud-save">${ic('check','s')}儲存</button></div>`:`<button class="btn sm" data-a="bud-edit">${ic('edit','s')}編輯</button>`}</div>
   <div class="list">${BUD.map((b,i)=>{const p=b.used/b.lim,s=state(p);
     if(S.budEdit)return `<div class="between" style="min-height:64px;border-bottom:1px solid var(--ln);flex-wrap:wrap"><span class="row" style="min-width:90px"><span style="color:${CATS[b.cat].c}">${ic(CATS[b.cat].ic)}</span>${b.cat}</span><div class="row" style="flex:1;justify-content:flex-end;flex-wrap:wrap"><label class="sr" for="lim-${i}" style="position:absolute;left:-9999px">${b.cat} 上限</label><input class="in num" id="lim-${i}" data-bi="${i}" inputmode="numeric" value="${b.lim}" style="width:120px;text-align:right"><label class="row xs mu" style="min-height:44px;cursor:pointer"><input type="checkbox" data-a="roll" data-i="${i}" ${b.roll?'checked':''} style="width:18px;height:18px;accent-color:var(--ac)">累積到下月</label></div></div>`;
     return `<details style="border-bottom:1px solid var(--ln)"><summary style="list-style:none;cursor:pointer;padding:12px 0;display:flex;flex-direction:column;gap:8px"><span class="between"><span class="row"><span style="color:${CATS[b.cat].c}">${ic(CATS[b.cat].ic)}</span><b style="font-weight:500">${b.cat}</b>${b.roll?'<span class="src">累積</span>':''}</span><span class="row">${stPill(s)}${ic('chev-d','s')}</span></span><span>${pbar(p,s)}</span><span class="between num xs"><span>${fmt(b.used)} / ${fmt(b.lim)}</span><span class="${s==='ok'?'mu':''}" style="${s==='over'?'color:var(--dg)':s==='warn'?'color:var(--wa)':''}">${s==='over'?'超出 '+fmt(b.used-b.lim):'剩 '+fmt(b.lim-b.used)} · ${Math.round(p*100)}%</span></span></summary>
       <div style="padding:0 0 12px 30px">${b.subs.length?b.subs.map(([n,v])=>`<button class="between sm" data-a="gotx-sub" data-cat="${b.cat}" data-k="${n}" style="width:100%;min-height:40px;background:none;border:0;border-top:1px dashed var(--ln);color:var(--tx);cursor:pointer;font:inherit"><span>${n}</span><span class="num">${fmt(v)}</span></button>`).join(''):'<p class="xs mu">還沒有子分類支出</p>'}</div></details>`}).join('')}</div>

  }else{
    const rem=p.budget-p.spent,days=daysBetween(p.from,p.to)+1;
    const tripDays=[...Array(days)].map((_,i)=>addDays(p.from,i));
    det=`<div class="card"><div class="ch"><h2 class="h2">${ic('plane')}${p.name}</h2><span class="st neu">${daysBetween(TODAY,p.from)} 天後出發</span></div>
     <div class="panel-tot"><div><span class="eyebrow">已花</span><span class="amt">${fmt(p.spent)}</span></div><div><span class="eyebrow">剩餘</span><span class="amt">${fmt(rem)}</span></div><div><span class="eyebrow">每日可用</span><span class="amt">${fmt(rem/days)}</span><span class="xs mu">剩餘 ÷ ${days} 天</span></div></div>
     <div style="margin:14px 0 6px">${pbar(p.spent/p.budget)}</div>

     <div class="list plain">${p.items.map(([d,m,c,v])=>`<div class="between" style="min-height:56px;border-bottom:1px solid var(--ln)"><span class="row"><span class="cat-ic" style="color:${c.startsWith('交通')?'var(--c2)':'var(--c6)'}">${ic(c.startsWith('交通')?'plane':'house')}</span><span><b style="font-weight:500">${m}</b><br><span class="xs mu">${c} · Cube 信用卡 · ${md(d)}</span></span></span><span class="amt">${MINUS}${fmt(v)}</span></div>`).join('')}</div>

function vGoals(){
  const g=GOALS.find(x=>x.id===S.goal)||GOALS[0],gi=goalInfo(g);
  let c=0;const cum=g.rec.map(r=>c+=r[1]);
  const [sy,sm]=g.rec[0][0].split('-').map(Number),[dy,dm]=g.due.split('-').map(Number);const N=(dy-sy)*12+(dm-sm)+1;
  const projEnd=Math.min(g.target*1.15,gi.saved+gi.pace*(N-cum.length));
  const list=`<div class="stack">${GOALS.map(x=>{const xi=goalInfo(x);return `<button class="card tap" style="${x.id===g.id?'border-color:var(--ac)':''}" data-a="goal" data-id="${x.id}"><div class="between"><b style="font-weight:500">${x.name}</b>${xi.behind?'<span class="st warn">! 落後</span>':'<span class="st ok">'+ic('check','s')+'如期</span>'}</div><div class="between num xs mu" style="margin:6px 0"><span>${fmt(xi.saved)} / ${fmt(x.target)}</span><span>${pct1(xi.saved/x.target)}</span></div>${pbar(xi.saved/x.target,xi.behind?'warn':'ok',true)}<div class="between xs mu" style="margin-top:6px"><span>期限 ${x.due.replace('-','/')}</span><span>預計 <span class="num">${xi.eta}</span></span></div></button>`}).join('')}<button class="btn wide" data-a="toast" data-msg="建立目標：名稱、目標金額、期限、起始金額、進度來源（示範）">${ic('plus')}建立目標</button></div>`;
  const det=`<div class="card"><div class="ch"><h2 class="h2">${ic('target')}${g.name}</h2><span class="xs mu">${g.src}</span></div>
    <div class="between" style="align-items:flex-end;flex-wrap:wrap"><div><p class="eyebrow">已存</p><div class="huge">${fmt(gi.saved)}</div><p class="sm mu num" style="margin:4px 0 0">目標 ${fmt(g.target)} · ${pct1(gi.saved/g.target)}</p></div><div class="row"><button class="btn" data-a="goal-mv" data-v="-1">${ic('out','s')}取出</button><button class="btn p" data-a="goal-mv" data-v="1">${ic('in','s')}存入</button></div></div>

  let body='';

    body=`<div class="list">${ACCS.filter(x=>!x.archived&&x.g!=='invest').map(x=>{const d=daysBetween(x.rec,TODAY);return `<button class="between" data-a="rec-acc" data-id="${x.id}" style="width:100%;min-height:64px;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);cursor:pointer;text-align:left;font:inherit"><span class="row"><span class="acc-ic">${ic(x.ic)}</span><span><b style="font-weight:500">${x.name}</b><br><span class="xs ${d>30?'':'mu'}" style="${d>30?'color:var(--wa)':''}">${d>30?'! ':''}上次 ${md(x.rec)} · ${d} 天前</span></span></span><span class="row"><span class="amt">${fmtS(x.bal)}</span>${ic('chev-r','s')}</span></button>`}).join('')}</div>`;
  }else if(R.step===2){
    body=`<div class="stack" style="gap:16px"><div class="callout ok">${ic(a.ic)}<div><b>${a.name}</b><br><span class="sm">App 計算餘額 <b class="num">${fmtS(a.bal)}</b></span></div></div>
      <div class="fld"><label class="eyebrow" for="rec-actual">銀行或 App 上看到的實際餘額</label><div class="amt-box ${R.err?'bad':''}"><span class="cur">NT$</span><input id="rec-actual" class="amt-in" inputmode="decimal" placeholder="0" value="${esc(R.actual)}" autocomplete="off" ${R.err?'aria-invalid="true" aria-describedby="rec-err"':''}></div>${R.err?`<p class="err" id="rec-err">${ic('alert','s')}${R.err}</p>`:''}${a.g==='credit'?'<p class="xs mu" style="margin:0">信用卡請輸入負數，例如 −6354</p>':''}</div>
      <div class="fld"><label class="eyebrow" for="rec-date">餘額日期</label><input id="rec-date" class="in" type="date" value="${R.date}"></div>
      <div class="row"><button class="btn" data-a="rec-back">${ic('chev-l','s')}上一步</button><button class="btn p" style="flex:1" data-a="rec-next">核對</button></div></div>`;
  }else{
    const actual=parseFloat(String(R.actual).replace(/[−−]/,'-').replace(/,/g,'')),diff=Math.round(actual-a.bal);
    const since=TX.filter(t=>(t.acc===a.id||t.to===a.id)&&t.d>a.rec).sort((x,y)=>(y.d+y.t).localeCompare(x.d+x.t));
    body=`<div class="panel-tot"><div><span class="eyebrow">App 計算</span><span class="amt">${fmtS(a.bal)}</span></div><div><span class="eyebrow">實際餘額</span><span class="amt">${fmtS(actual)}</span></div><div><span class="eyebrow">差額</span><span class="amt" style="color:${diff?'var(--wa)':'var(--ac)'}">${diff?fmtSigned(diff):'0'}</span></div></div>`+
    (R.done||!diff?`<div class="empty"><div class="cat-ic" style="width:64px;height:64px;color:var(--ac);border-color:var(--ac)">${ic('check')}</div><h3>已核對 ✓</h3><p>${a.name} 的餘額和銀行一致，對帳日期更新為 ${R.date.replace(/-/g,'/')}。</p><button class="btn p" data-a="rec-reset">完成</button></div>`
    :`<div class="callout warn" style="margin-top:16px">${ic('alert')}<div>App 比實際${diff>0?'少':'多'}了 <b class="num">${fmt(diff)}</b>。可能有漏記或重複記錄。</div></div>
      <div class="stack" style="margin-top:12px">
        <button class="opt" data-a="rec-check">${ic('search')}<span><b>(a) 檢查期間交易</b><span class="sm mu">列出 ${md(a.rec)} 上次對帳之後的 ${since.length} 筆交易，找出漏記</span></span></button>
        <button class="opt" data-a="rec-adj" data-d="${diff}">${ic('scale')}<span><b>(b) 記一筆調整</b><span class="sm mu">自動補 ${fmtSigned(diff)}，標示為「餘額調整」，不計入收支報表</span></span></button>
      </div>
      ${R.showTx?`<p class="eyebrow" style="margin:18px 0 0">上次對帳後的交易</p><div class="list plain">${since.length?since.map(t=>txRow(t,{showDate:true})).join(''):'<p class="sm mu">沒有交易</p>'}</div>`:''}
      <button class="btn g" style="margin-top:12px" data-a="rec-back">${ic('chev-l','s')}重新輸入</button>`);
  }
  return `<div class="grid"><div class="card sp-8"><div class="ch"><h2 class="h2">${ic('scale')}對帳</h2>${R.step>1?`<button class="btn sm g" data-a="rec-reset">重新開始</button>`:''}</div>${steps}<div style="margin-top:18px">${body}</div></div>
   <div class="card sp-4"><div class="ch"><h2 class="h2">對帳紀錄</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th>帳戶</th><th class="r">差額</th></tr></thead><tbody>${REC_HIST.map(([d,n,df])=>`<tr><td class="num">${d.replace(/-/g,'/')}</td><td>${n}</td><td class="r num" style="${df?'color:var(--wa)':''}">${df?fmtSigned(df):ic('check','s')}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

const QUICK={expense:[['餐飲','午餐'],['餐飲','飲料'],['餐飲','早餐'],['餐飲','晚餐'],['購物','超市'],['交通','捷運']],income:[['收入','生活費'],['收入','打工'],['收入','獎學金'],['收入','退款']]};

   <div class="fld"><span class="eyebrow">專案／標籤</span><div class="wrap-row"><button class="chip" data-a="toast" data-msg="依專案篩選（示範）">${ic('plane','s')}日本東京 5 天</button><button class="chip" data-a="f-q" data-v="">#返鄉</button></div></div>

function showSheet(){$('#sheet').classList.add('on');$('#scrim').classList.add('on');document.body.style.overflow='hidden'}
function closeAll(){$('#sheet').classList.remove('on','full');$('#dlg').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';S.sheet=null}
function suggest(){
  const box=$('#sugg');if(!box)return;const q=E.m.trim();
  if(!q){box.innerHTML='';return}
  const seen={};TX.forEach(t=>{if(t.type!=='transfer'&&t.m.toLowerCase().includes(q.toLowerCase())&&!seen[t.m]&&t.m!==q)seen[t.m]=t});
  const it=Object.values(seen).slice(0,4);
  box.innerHTML=it.length?`<div class="sugg" style="margin-top:6px" role="listbox" aria-label="商家建議">${it.map(t=>`<button data-a="sug" data-id="${t.id}" role="option"><span>${esc(t.m)}</span><span class="xs mu">${t.unc?'未分類':t.cat+' › '+t.sub} · ${accLabel(t.acc)}</span></button>`).join('')}</div>`:'';
}
function saveEntry(again){
  const e=E,err={},amt=parseFloat(e.amt);
  if(!(amt>0))err.amt='請輸入金額（大於 0）';
  if(!e.acc)err.acc=e.type==='transfer'?'請選擇轉出帳戶':'請選擇帳戶';
  if(e.type==='transfer'){if(!e.to)err.to='請選擇轉入帳戶';else if(e.to===e.acc)err.to='轉出和轉入不能是同一個帳戶，請改選其他帳戶'}
  else if(!e.cat)err.cat='請選擇分類';
  e.err=err;
  if(Object.keys(err).length){renderSheet();const f=$('.sheet .err');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});return}
  const label=e.type==='transfer'?(e.m||'轉帳'):(e.sub||e.cat);
  const t={d:e.date,t:e.time,m:e.m||label,type:e.type,cat:e.type==='transfer'?null:e.cat,sub:e.type==='transfer'?null:e.sub,acc:e.acc,to:e.type==='transfer'?e.to:undefined,fee:+e.fee||0,amt,src:'網頁',tags:e.tags.split(/[\s,#]+/).filter(Boolean),note:e.note,proj:e.proj||null,cur:e.cur};
  let undo;
  if(e.mode==='edit'){
    const i=TX.findIndex(x=>x.id===e.id),old=TX[i];applyBal(old,-1);
    const nt=Object.assign({},old,t,{unc:false,hist:old.hist.concat([{at:'11/03 '+new Date().toTimeString().slice(0,5),src:'網頁',what:'修改：'+diffText(old,t)}])});
    TX[i]=nt;applyBal(nt,1);
    undo=()=>{applyBal(TX[i],-1);TX[i]=old;applyBal(old,1);render(true)};
    closeAll();toast(`已更新 ${label} ${fmt(amt)}`,undo);
  }else{
    const nt=Object.assign({id:uid++,hist:[{at:md(t.d)+' '+t.t,src:'網頁',what:'建立'}]},t);TX.push(nt);applyBal(nt,1);
    undo=()=>{const i=TX.indexOf(nt);if(i>-1){TX.splice(i,1);applyBal(nt,-1);render(true)}};
    if(again){const k={type:e.type,acc:e.acc,date:e.date};E=Object.assign(newEntry(),k);renderSheet();setTimeout(()=>$('#e-amt')?.focus(),50)}else closeAll();
    toast(`已記錄 ${label} ${fmt(amt)}`,undo);
  }
  render(true);
}
function diffText(o,n){const c=[];if(o.amt!==n.amt)c.push(`金額 ${o.amt} → ${n.amt}`);if(o.acc!==n.acc)c.push(`帳戶 ${accLabel(o.acc)} → ${accLabel(n.acc)}`);if(o.cat!==n.cat||o.sub!==n.sub)c.push(`分類 → ${n.cat||''}${n.sub?' › '+n.sub:''}`);if(o.m!==n.m)c.push(`項目 → ${n.m}`);return c.join('、')||'沒有變更'}

/* ================= DIALOG / TOAST ================= */
let dlgOk=null;
function dialog(title,body,okLabel,ok,danger){
  dlgOk=ok;
  $('#dlg').innerHTML=`<h2 id="dlg-title">${title}</h2><div class="sm">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="dlg-cancel">取消</button><button class="btn ${danger?'d':'p'}" data-a="dlg-ok">${okLabel}</button></div>`;
  $('#dlg').classList.add('on');$('#scrim').classList.add('on');
  setTimeout(()=>$('#dlg [data-a="dlg-cancel"]').focus(),50);
}
let toastT,toastUndo=null;
function toast(msg,undo,extra){
  toastUndo=undo||null;const el=$('#toast');
  el.innerHTML=`<span>${msg}</span>${undo?`<button class="btn" data-a="undo">${ic('undo','s')}復原</button>`:''}${extra||''}`;
  el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),5200);
}
function delTx(id){
  const i=TX.findIndex(t=>t.id===id);if(i<0)return;const t=TX[i];TX.splice(i,1);applyBal(t,-1);S.deleted.unshift(t);S.sel.delete(id);
  closeAll();render(true);
  toast(`已刪除 ${esc(t.m)} ${fmt(t.amt)}`,()=>{TX.splice(i,0,t);applyBal(t,1);S.deleted=S.deleted.filter(x=>x!==t);render(true)});
}

/* ================= SWIPE ================= */
function bindSwipe(){
  if(S.batch)return;
  document.querySelectorAll('#txbody .sw, #view .sw').forEach(sw=>{
    const row=sw.querySelector('.tx');if(!row||row.dataset.b)return;row.dataset.b='1';
    let x0=null,y0=0,dx=0,drag=false,base=0;
    row.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&matchMedia('(min-width:960px)').matches)return;x0=e.clientX;y0=e.clientY;dx=0;drag=false;base=sw.classList.contains('open')?-136:0});
    row.addEventListener('pointermove',e=>{
      if(x0==null)return;const mx=e.clientX-x0,my=e.clientY-y0;
      if(!drag){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;try{row.setPointerCapture(e.pointerId)}catch(_){}row.style.transition='none'}else if(Math.abs(my)>10){x0=null;return}else return}
      dx=mx;row.style.transform=`translateX(${Math.max(-160,Math.min(0,base+dx))}px)`;
    });
    const end=()=>{if(x0==null)return;x0=null;row.style.transition='';if(!drag)return;
      const open=base+dx<-60;document.querySelectorAll('.sw.open').forEach(o=>{if(o!==sw){o.classList.remove('open');o.querySelector('.tx').style.transform=''}});
      sw.classList.toggle('open',open);row.style.transform=open?'translateX(-136px)':'';row.dataset.dragged='1';setTimeout(()=>delete row.dataset.dragged,60)};
    row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=ACT[el.dataset.a];if(!f)return;
  if(el.tagName==='A'||el.dataset.a==='stocks')e.preventDefault();
  if(el.dataset.a==='sel'||el.dataset.a==='roll'){f(el,e);return}
  f(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='q'){S.filters.q=t.value;refreshTx();return}
  if(!E&&S.sheet==='entry')return;
  if(id==='e-amt'){E.amt=t.value.replace(/[^\d.]/g,'');if(t.value!==E.amt)t.value=E.amt}
  else if(id==='e-m'){E.m=t.value;suggest()}
  else if(id==='e-note')E.note=t.value;
  else if(id==='e-tags')E.tags=t.value;
  else if(id==='e-fee')E.fee=t.value;
  else if(id==='rec-actual')S.rec.actual=t.value;
  else if(id==='f-min'){S.filters.min=t.value.replace(/\D/g,'')}
  else if(id==='f-max'){S.filters.max=t.value.replace(/\D/g,'')}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='e-d'){E.date=t.value;renderSheet()}
  else if(id==='e-t')E.time=t.value;
  else if(id==='e-proj')E.proj=t.value;
  else if(id==='e-cur'){E.cur=t.value;renderSheet()}
  else if(id==='rec-date')S.rec.date=t.value;
  else if(id==='f-min'||id==='f-max')renderSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&($('#sheet').classList.contains('on')||$('#dlg').classList.contains('on')))ACT.closeall()});
document.addEventListener('pointermove',e=>{
  const h=e.target.closest&&e.target.closest('.hit');if(!h)return;
  const key=h.dataset.chart,c=CH[key];if(!c)return;const svg=h.ownerSVGElement;const r=svg.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*c.W;const i=Math.floor((x-c.L)/(c.iw/c.n));
  const ro=$('#ro-'+key);if(ro)ro.innerHTML=readout(key,i);
  const g=$('#gd-'+key);if(g){const gx=c.L+(Math.max(0,Math.min(c.n-1,i))+.5)*(c.iw/c.n);g.setAttribute('x1',gx);g.setAttribute('x2',gx);g.setAttribute('visibility','visible')}
});
window.addEventListener('hashchange',()=>{closeAll();route();render()});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>shell());

route();render();
</script>
</body>
</html>
